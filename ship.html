input,select,textarea{font-family:inherit;font-size:15px;padding:10px 11px;border-radius:11px;

color:var(--muted);font-size:22px;cursor:pointer;}

padding:9px 12px;text-align:center;font-weight:600;z-index:40;}

margin-top:8px;line-height:1.45;}.demo a{color:#fff;}

<script>
/* ---------- хранилище: накладные с фото живут в телефоне (IndexedDB) ---------- */
var DB=null, VIEW='list', CUR=null, PHOTOTARGET=null;
var PHOTO_DAYS=30;     /* через сколько дней фото удаляются */
var MAX_PH=5;          /* фото на накладную и на позицию */
function itemPhotos(it){ return (it.photos&&it.photos.length)?it.photos:(it.photo?[it.photo]:[]); }
function phCount(r){ return (r.photos||[]).length+(r.items||[]).reduce(function(n,i){return n+itemPhotos(i).length;},0); }
var KEEP_DAYS=90;      /* через сколько дней удаляется выгруженная накладная целиком */
var STORES=['Дом одежды','Дракон (Костанай)','Подарки (Петропавловск)','Поставщик','Склад'];
var TO=['Дракон (Костанай)','Подарки (Петропавловск)','Дом одежды'];

function open_db(){
  return new Promise(function(res,rej){
    var r=indexedDB.open('fm_ship',1);
    r.onupgradeneeded=function(e){
      var db=e.target.result;
      if(!db.objectStoreNames.contains('ships')) db.createObjectStore('ships',{keyPath:'id'});
    };
    r.onsuccess=function(e){ DB=e.target.result; res(DB); };
    r.onerror=function(){ rej(r.error); };
  });
}
function tx(mode){ return DB.transaction('ships',mode).objectStore('ships'); }
function put(rec){ return new Promise(function(res,rej){ var q=tx('readwrite').put(rec); q.onsuccess=function(){res(rec);}; q.onerror=function(){rej(q.error);}; }); }
function all(){ return new Promise(function(res,rej){ var q=tx('readonly').getAll(); q.onsuccess=function(){res(q.result||[]);}; q.onerror=function(){rej(q.error);}; }); }
function get(id){ return new Promise(function(res,rej){ var q=tx('readonly').get(id); q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);}; }); }
function del(id){ return new Promise(function(res){ var q=tx('readwrite').delete(id); q.onsuccess=function(){res();}; }); }

/* ---------- выгрузка в Google Таблицу ----------
   Адрес приёмника и токен — в зашифрованном buy.json (тот же файл, что у плашки закупа):
   расшифровываем паролем, под которым баер уже вошёл. Шлём по одной накладной и по одному фото
   за запрос; что дошло, отмечаем в самой накладной, поэтому повтор продолжает с места обрыва. */
var CFG={url:'',token:''}, UPLOADING=false, UPLOAD_ID='';
function patchRec(id,fn){
  return get(id).then(function(r){ if(!r) return null; fn(r); if(CUR&&CUR.id===id) fn(CUR); return put(r); });
}
function markDirty(){
  if(!CUR) return;
  CUR.ver=(CUR.ver||0)+1;
  if(CUR.status==='sent'||CUR.status==='queued'){
    /* поправили после отправки — уйдёт заново. Если фото в телефоне уже убраны уборкой,
       старые снимки на Диске не трогаем: заменить их нечем */
    CUR.needReset=!CUR.trimmed; CUR.uploaded={}; CUR.status='queued';
  }
}
function b64bytes(t){ var x=atob(t),a=new Uint8Array(x.length); for(var i=0;i<x.length;i++) a[i]=x.charCodeAt(i); return a; }
function loadCfg(){
  return fetch('buy.json?v='+Date.now()).then(function(r){ return r.json(); }).then(function(j){
    if(j.v!==2) return j;
    var a=JSON.parse(localStorage.getItem('buy_auth')||'null');
    if(!a) throw new Error('нет входа');
    var enc=new TextEncoder();
    return crypto.subtle.importKey('raw',enc.encode(String(a.l).trim().toLowerCase()+':'+a.p),'PBKDF2',false,['deriveKey'])
      .then(function(k){ return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64bytes(j.salt),iterations:120000,hash:'SHA-256'},
                                                       k,{name:'AES-GCM',length:256},false,['decrypt']); })
      .then(function(key){ return crypto.subtle.decrypt({name:'AES-GCM',iv:b64bytes(j.iv)},key,b64bytes(j.ct)); })
      .then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }).then(function(d){
    CFG={url:d.url||'',token:d.token||''};
    try{ localStorage.setItem('fm_ship_cfg',JSON.stringify(CFG)); }catch(e){}
    return CFG;
  }).catch(function(){
    /* нет связи или сменили пароль — берём последний известный адрес */
    try{ var c=JSON.parse(localStorage.getItem('fm_ship_cfg')||'null'); if(c&&c.url) CFG=c; }catch(e){}
    return CFG;
  });
}
function api(body){
  /* Google под нагрузкой иногда отвечает страницей (404) вместо JSON — это временно, не ошибка данных.
     Тайм-аут 90 с: без него запрос на слабой связи висит бесконечно и держит всю очередь. */
  var ctl=(typeof AbortController!=='undefined')?new AbortController():null;
  var timer=ctl?setTimeout(function(){ ctl.abort(); },90000):null;
  return fetch(CFG.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                        body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
    .then(function(r){ return r.text(); })
    .then(function(t){
      if(timer) clearTimeout(timer);
      var res=null; try{ res=JSON.parse(t); }catch(e){}
      if(!res) throw new Error('Google сейчас занят');
      if(!res.ok) throw new Error(res.error||'приёмник не ответил');
      return res;
    },function(e){
      if(timer) clearTimeout(timer);
      throw (e&&e.name==='AbortError')?new Error('Google не ответил за 90 секунд'):e;
    });
}
function apiRetry(body,tries){
  tries=tries||3;
  return api(body).catch(function(e){
    var окончательно=/неверный токен|нет доступа|пустое фото|нет id/.test(e.message);
    if(tries<=1||окончательно) throw e;
    return new Promise(function(r){ setTimeout(r,5000); }).then(function(){ return apiRetry(body,tries-1); });
  });
}
function pad2(n){ return (n<10?'0':'')+n; }
function photoList(r){
  var out=[];
  (r.photos||[]).forEach(function(p,i){ out.push({name:'nakl_'+(i+1)+'.jpg',data:p}); });
  (r.items||[]).forEach(function(it,k){
    itemPhotos(it).forEach(function(p,j){ out.push({name:'poz_'+pad2(k+1)+'_'+(j+1)+'.jpg',data:p}); });
  });
  return out;
}
function showBar(t){ var el=document.getElementById('upbar'); if(!el) return; el.textContent=t||''; el.style.display=t?'':'none'; }
function uploadQueue(){
  if(UPLOADING||!CFG.url||!CFG.token) return Promise.resolve();
  if(navigator.onLine===false) return Promise.resolve();
  UPLOADING=true;
  return all().then(function(rows){
    var q=rows.filter(function(r){ return r.status==='queued'; })
              .sort(function(a,b){ return (a.created||'').localeCompare(b.created||''); });
    return q.reduce(function(pr,rec,i){ return pr.then(function(){ return uploadOne(rec.id,i+1,q.length); }); },
                    Promise.resolve()).then(function(){ return q.length; });
  }).then(function(n){
    UPLOADING=false; UPLOAD_ID='';
    if(n){ showBar('Выгружено в реестр ✓'); setTimeout(function(){ showBar(''); },2500); syncStatuses(true); }
    обновитьЭкран();
  }).catch(function(err){
    UPLOADING=false; UPLOAD_ID='';
    showBar('Не выгрузилось: '+((err&&err.message)||err)+'. Повторю, когда появится связь.');
    обновитьЭкран();
  });
}
/* ---------- что с накладной после отправки ----------
   Реестр знает то, чего не знает телефон: сколько дней в пути, приняли ли груз и кто. Раз в минуту
   (и после выгрузки) спрашиваем статусы своих отправленных накладных и показываем их в списке. */
var SYNC_AT=0;
function syncStatuses(force){
  if(!CFG.url||!CFG.token||navigator.onLine===false) return Promise.resolve();
  if(!force&&Date.now()-SYNC_AT<60000) return Promise.resolve();
  SYNC_AT=Date.now();
  return all().then(function(rows){
    var ids=rows.filter(function(r){ return r.status==='sent'; }).map(function(r){ return r.id; });
    if(!ids.length) return null;
    return api({action:'ship_status',token:CFG.token,ids:ids}).then(function(res){
      var its=res.items||{};
      return Promise.all(ids.map(function(id){
        return its[id]?patchRec(id,function(r){ r.remote=its[id]; }):null;
      }));
    }).then(function(){ if(VIEW==='list') render(); });
  }).catch(function(){});
}
function бейджРеестра(rm){
  rm=rm||{};
  if(rm.status==='доставлено') return '<span class="st s-sent">доставлено</span>';
  if(rm.status==='доставлено с расхождением') return '<span class="st s-disc">с расхождением</span>';
  if(rm.status==='в пути') return '<span class="st '+(rm.late?'s-late':'s-queued')+'">в пути'+(rm.days?' '+esc(rm.days):'')+'</span>';
  return '<span class="st s-sent">в реестре</span>';
}
function обновитьЭкран(){
  if(VIEW==='list'){ render(); return; }
  var a=document.activeElement;
  if(CUR && !(a && /INPUT|TEXTAREA|SELECT/.test(a.tagName))) render();   /* не мешаем печатать */
}
function uploadOne(id,n,total){
  var tag='Накладная '+n+' из '+total+': ', ver0=0, reset=false;
  UPLOAD_ID=id;
  if(VIEW==='list') render();
  return get(id).then(function(rec){
    if(!rec||rec.status!=='queued') return null;
    ver0=rec.ver||0; reset=!!rec.needReset;
    var head={id:rec.id,date:rec.date,from:rec.from,to:rec.to,places:rec.places,who:rec.who,note:rec.note,
              shipPhotos:(rec.photos||[]).length,
              itemPhotos:(rec.items||[]).reduce(function(t,i){ return t+itemPhotos(i).length; },0),
              items:(rec.items||[]).map(function(i){ return {art:i.art,sizes:i.sizes,packs:i.packs,perPack:i.perPack,
                                                             qty:i.qty,photos:itemPhotos(i).length}; })};
    showBar(tag+'шапка и состав…');
    return apiRetry({action:'ship_begin',token:CFG.token,ship:head,reset:reset}).then(function(res){
      return patchRec(id,function(r){
        if(reset) r.uploaded={};
        if((r.ver||0)===ver0) r.needReset=false;
        r.viewUrl=res.viewUrl; r.folderUrl=res.folder;
      });
    }).then(function(){ return get(id); }).then(function(r){
      var фото=photoList(r), up=r.uploaded||{};
      var todo=фото.filter(function(f){ return !up[f.name]; }), готово=фото.length-todo.length;
      return todo.reduce(function(pr,f){ return pr.then(function(){
        готово++; showBar(tag+'фото '+готово+' из '+фото.length+'…');
        return apiRetry({action:'ship_photo',token:CFG.token,shipId:id,name:f.name,
                    data:String(f.data).replace(/^data:image\/[a-z]+;base64,/,'')})
          .then(function(){ return patchRec(id,function(x){ x.uploaded=x.uploaded||{}; x.uploaded[f.name]=true; }); });
      }); },Promise.resolve());
    }).then(function(){
      showBar(tag+'завершаю…');
      return apiRetry({action:'ship_finish',token:CFG.token,shipId:id});
    }).then(function(res){
      return patchRec(id,function(r){
        if((r.ver||0)!==ver0) return;          /* правили во время выгрузки — уйдёт ещё раз */
        r.status='sent'; r.sentAt=new Date().toISOString(); r.viewUrl=res.viewUrl||r.viewUrl;
      });
    });
  });
}

/* ---------- уборка: фото тяжёлые, данные лёгкие ---------- */
function ageDays(rec){
  var t=Date.parse(rec.created||'')||0;
  if(!t) return 0;
  return Math.floor((Date.now()-t)/86400000);
}
function housekeeping(){
  return all().then(function(rows){
    var чистка=[], удаление=[];
    rows.forEach(function(r){
      var d=ageDays(r);
      if(d>KEEP_DAYS && r.status==='sent'){ удаление.push(r.id); return; }
      if(d>PHOTO_DAYS && !r.trimmed && r.status==='sent'){
        var было=phCount(r);
        if(было){
          r.photos=[];
          (r.items||[]).forEach(function(i){ i.photo=''; i.photos=[]; });
          r.trimmed=было;                     /* помним, сколько снимков было */
          чистка.push(put(r));
        }
      }
    });
    return Promise.all(чистка.concat(удаление.map(del))).then(function(){
      return {фото:чистка.length, удалено:удаление.length};
    });
  });
}
function место(){
  if(!navigator.storage||!navigator.storage.estimate) return Promise.resolve(null);
  return navigator.storage.estimate().then(function(e){ return e.usage||0; }).catch(function(){ return null; });
}
function мб(b){ return (b/1048576).toFixed(1).replace('.',',')+' МБ'; }
function чиститьСейчас(){
  if(!confirm('Убрать из телефона фото выгруженных накладных старше '+PHOTO_DAYS+' дней? На Google Диске они останутся.')) return;
  all().then(function(rows){
    var ops=[];
    rows.forEach(function(r){
      if(ageDays(r)>PHOTO_DAYS && (phCount(r)>0) && r.status==='sent'){
        var было=phCount(r);
        r.photos=[]; (r.items||[]).forEach(function(i){ i.photo=''; i.photos=[]; }); r.trimmed=было;
        ops.push(put(r));
      }
    });
    Promise.all(ops).then(function(){ go('list'); });
  });
}

function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function today(){ var d=new Date(); return d.toISOString().slice(0,10); }
function ru(d){ if(!d) return ''; var p=String(d).split('-'); return p.length===3?(p[2]+'.'+p[1]+'.'+p[0]):d; }
function who(){ try{ return localStorage.getItem('fm_ship_who')||''; }catch(e){ return ''; } }

/* фото с камеры: ужимаем до 1280 px, иначе телефон забьётся за неделю */
function shrink(file){
  return new Promise(function(res){
    var fr=new FileReader();
    fr.onload=function(){
      var img=new Image();
      img.onload=function(){
        var m=1280, w=img.width, h=img.height;
        if(w>m||h>m){ if(w>h){ h=Math.round(h*m/w); w=m; } else { w=Math.round(w*m/h); h=m; } }
        var c=document.createElement('canvas'); c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',0.72));
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
/* снимки: камера (cam) или галерея (gal, можно сразу несколько); больше MAX_PH не берём */
function addFiles(files){
  if(!files.length||!PHOTOTARGET||!CUR) return;
  collect();
  var tgt=PHOTOTARGET;
  function arr(){
    if(tgt.kind==='ship') return CUR.photos||(CUR.photos=[]);
    var it=CUR.items[tgt.idx];
    if(!it.photos||!it.photos.length) it.photos=it.photo?[it.photo]:[];
    return it.photos;
  }
  var свободно=MAX_PH-arr().length;
  if(свободно<=0){ alert('Уже '+MAX_PH+' фото. Удалите лишнее, чтобы добавить новое.'); return; }
  var взять=files.slice(0,свободно), лишних=files.length-взять.length;
  взять.reduce(function(p,f){ return p.then(function(){ return shrink(f).then(function(d){ arr().push(d); }); }); },
               Promise.resolve())
  .then(function(){ if(tgt.kind!=='ship'){ var it=CUR.items[tgt.idx]; it.photo=it.photos[0]||''; } markDirty(); return put(CUR); })
  .then(function(){
    render();
    if(лишних>0) alert('Добавлено '+взять.length+' фото: на '+(tgt.kind==='ship'?'накладную':'позицию')+
                       ' помещается не больше '+MAX_PH+'.');
  });
}

  var nv={from:g('f_from'),to:g('f_to'),date:g('f_date'),places:+g('f_places')||0,who:g('f_who'),note:g('f_note')};
  var поменяли=Object.keys(nv).some(function(k){ return String(CUR[k]==null?'':CUR[k])!==String(nv[k]); });
  Object.keys(nv).forEach(function(k){ CUR[k]=nv[k]; });
  if(поменяли) markDirty();
  try{ localStorage.setItem('fm_ship_who',CUR.who||''); }catch(e){}

  CUR.items[i][k]= (k==='packs'||k==='perPack') ? (+v||0) : v;
  CUR.items[i].qty=(+CUR.items[i].packs||0)*(+CUR.items[i].perPack||0);
  markDirty();

    if(sp) sp.innerHTML=(+CUR.items[i].packs||0)+' уп. × '+(+CUR.items[i].perPack||0)+' шт = <b>'+
      (+CUR.items[i].qty||0)+'</b> шт'+(CUR.items[i].sizes?(' · '+esc(CUR.items[i].sizes)):'');

function dropShip(){

               'как только подключим, накладная уйдёт в реестр сама.');

var авторизован=false;
try{ авторизован=!!localStorage.getItem('buy_auth'); }catch(e){}
if(!авторизован&&!DEMO){
  document.getElementById('gate').style.display='';
} else {
  document.getElementById('app').style.display='';
  if(DEMO) document.getElementById('app').insertAdjacentHTML('afterbegin','<div class="demo">👀 Пример интерфейса: накладные '+
    'ненастоящие, в телефон и в таблицу ничего не сохраняется. <a href="ship.html">Выйти из примера</a></div>');
  open_db().then(housekeeping).then(function(){ go('list'); return loadCfg(); }).then(function(){
    if(VIEW==='list') render();
    uploadQueue().then(function(){ return syncStatuses(true); });
  }).catch(function(){
    document.getElementById('body').innerHTML='<div class="note">Телефон не даёт сохранять накладные '+
    '(закрытый режим браузера?). Откройте страницу в обычном окне.</div>';
  });
  window.addEventListener('online',function(){ uploadQueue(); });
  setInterval(function(){ if(document.visibilityState==='visible'){ uploadQueue(); syncStatuses(); } },60000);
}
