<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Остатки Family Market</title>
<style>
:root{--bg:#F5F7FA;--surface:#FFFFFF;--surface2:#EEF1F6;--ink:#161C26;--muted:#6B7688;--line:#E3E8F0;--accent:#1F5FA8;--good:#177A3A;--zero:#9AA3AF;--chip:#EAF1FB;--shadow:0 1px 2px rgba(20,30,50,.06),0 4px 16px rgba(20,30,50,.05);}
@media (prefers-color-scheme:dark){:root{--bg:#0E141E;--surface:#161F2C;--surface2:#1E2836;--ink:#E9EDF4;--muted:#93A0B4;--line:#26303F;--accent:#5FA0E6;--good:#49D17F;--zero:#5C6676;--chip:#1B2838;--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.35);}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-text-size-adjust:100%;}
.wrap{max-width:640px;margin:0 auto;padding:0 14px calc(40px + env(safe-area-inset-bottom));}
header{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 0 10px;border-bottom:1px solid var(--line);}
.brand{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:10px;}
.brand h1{font-size:19px;margin:0;letter-spacing:.2px;}
.brand .sub{font-size:12px;color:var(--muted);}
.searchbox{position:relative;}
#q{width:100%;font-size:17px;padding:14px 44px 14px 16px;border:2px solid var(--accent);border-radius:14px;background:var(--surface);color:var(--ink);outline:none;box-shadow:var(--shadow);}
#q::placeholder{color:var(--muted);}
.searchbox .ic{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:18px;opacity:.6;pointer-events:none;}
.shot{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;margin-top:9px;
padding:13px 16px;border:0;border-radius:14px;background:var(--accent);color:#fff;font-size:15.5px;
font-weight:650;cursor:pointer;box-shadow:var(--shadow);font-family:inherit;}
.shot:active{transform:translateY(1px)}
.shot[disabled]{opacity:.65}
.ocr{margin-top:9px;font-size:12.5px;color:var(--muted);text-align:center;line-height:1.5}
.ocr b{color:var(--ink);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ocr .bad{color:#B4462E}
.ocrbar{height:4px;border-radius:3px;background:var(--surface2);overflow:hidden;margin-top:7px}
.ocrbar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.count{font-size:12px;color:var(--muted);margin:10px 2px 2px;}
.results{display:flex;flex-direction:column;gap:12px;margin-top:6px;}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;box-shadow:var(--shadow);}
.ctop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;}
.nm{font-size:15.5px;font-weight:650;line-height:1.3;}
.price{white-space:nowrap;font-size:15px;font-weight:750;color:var(--accent);}
.price small{font-weight:600;font-size:11px;color:var(--muted);}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:7px 0 11px;font-size:11.5px;color:var(--muted);}
.art{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--surface2);padding:2px 7px;border-radius:6px;color:var(--ink);letter-spacing:.3px;}
.clr{background:var(--chip);color:var(--accent);padding:2px 8px;border-radius:6px;font-weight:600;text-transform:capitalize;}
.stores{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.st{background:var(--surface2);border-radius:10px;padding:7px 4px;text-align:center;}
.st .l{font-size:10.5px;color:var(--muted);display:block;margin-bottom:2px;}
.st .v{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;}
.st.tot{background:var(--chip);}.st.tot .v{color:var(--accent);}
.v.z{color:var(--zero);font-weight:600;}
.sizes{margin-top:11px;border-top:1px dashed var(--line);padding-top:9px;}
.sz{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:2px 8px;font-size:13px;padding:3px 0;font-variant-numeric:tabular-nums;}
.sz.h{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:2px;}
.sz .szn{font-weight:650;}.sz .z{color:var(--zero);}
.hint,.empty{text-align:center;color:var(--muted);padding:38px 20px;font-size:14px;line-height:1.55;}
.hint b{color:var(--ink);}
.foot{margin-top:22px;text-align:center;font-size:11px;color:var(--muted);}
mark{background:rgba(31,95,168,.20);color:inherit;border-radius:3px;padding:0 1px;}
</style></head><body>
<div class="wrap">
  <header>
    <div class="brand"><h1>📦 Остатки Family Market</h1><span class="sub" id="gen">загрузка…</span></div>
    <div class="searchbox"><input id="q" type="search" inputmode="search" autocomplete="off" enterkeyhint="search" placeholder="Артикул или название — напр. 266-28-S-00002 или майка"><span class="ic">🔎</span></div>
    <button class="shot" id="shot">📷 Сфотографировать бирку</button>
    <input id="cam" type="file" accept="image/*" capture="environment" style="display:none">
    <div class="ocr" id="ocr"></div>
    <div class="count" id="count"></div>
  </header>
  <div class="results" id="res"></div>
  <div class="hint" id="hint">Введите <b>артикул с товара</b> или часть <b>названия</b> —<br>покажет цену и остаток по всем магазинам с разбивкой по размерам.</div>
  <div class="foot" id="foot"></div>
</div>
<script>
let ITEMS=[],DB={};
const nf=n=>Number(n).toLocaleString('ru-RU');
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function hi(txt,q){const t=String(txt);if(!q)return esc(t);const i=t.toLowerCase().indexOf(q.toLowerCase());if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}
const vcell=v=>'<span class="v'+(v?'':' z')+'">'+v+'</span>';
function card(o,q){
  let sizes='';const single=o.z.length===1&&(o.z[0][0]==='б/р'||o.z[0][0]==='ST');
  if(!single){sizes='<div class="sizes"><div class="sz h"><span>Размер</span><span>Дом</span><span>Дракон</span><span>Подарки</span></div>'+o.z.map(r=>'<div class="sz"><span class="szn">'+esc(r[0])+'</span><span class="'+(r[1]?'':'z')+'">'+r[1]+'</span><span class="'+(r[2]?'':'z')+'">'+r[2]+'</span><span class="'+(r[3]?'':'z')+'">'+r[3]+'</span></div>').join('')+'</div>';}
  return '<div class="card"><div class="ctop"><div class="nm">'+hi(o.n,q)+'</div><div class="price">'+(o.p?nf(o.p)+' <small>₸</small>':'<small>цена —</small>')+'</div></div><div class="meta"><span class="art">'+hi(o.a,q)+'</span>'+(o.c?'<span class="clr">🎨 '+esc(o.c)+'</span>':'')+(o.s?'<span>'+esc(o.s)+'</span>':'')+'</div><div class="stores"><div class="st"><span class="l">Дом одежды</span>'+vcell(o.d)+'</div><div class="st"><span class="l">Дракон</span>'+vcell(o.k)+'</div><div class="st"><span class="l">Подарки</span>'+vcell(o.g)+'</div><div class="st tot"><span class="l">Всего</span><span class="v">'+o.t+'</span></div></div>'+sizes+'</div>';
}
const res=document.getElementById('res'),hint=document.getElementById('hint'),cnt=document.getElementById('count');
let tmr;
function run(){
  const raw=document.getElementById('q').value.trim();
  if(raw.length<2){res.innerHTML='';cnt.textContent='';hint.style.display='';return;}
  hint.style.display='none';
  const qU=raw.toUpperCase().replace(/\s+/g,''),qL=raw.toLowerCase();const out=[];
  for(const o of ITEMS){if(o.A.includes(qU)||o.N.includes(qL)){out.push(o);if(out.length>250)break;}}
  out.sort((a,b)=>b.t-a.t);const CAP=40,shown=out.slice(0,CAP);
  cnt.textContent=out.length?('найдено '+out.length+(out.length>CAP?' — показаны первые '+CAP+', уточните запрос':'')):'';
  res.innerHTML=shown.map(o=>card(o,raw)).join('')||'<div class="empty">Ничего не найдено по «'+esc(raw)+'».<br>Проверьте артикул или попробуйте название.</div>';
}
fetch('stock.json?v='+Date.now()).then(r=>r.json()).then(db=>{
  DB=db;
  ITEMS=Object.entries(db.items).map(([a,v])=>{const d=v.z.reduce((x,r)=>x+r[1],0),k=v.z.reduce((x,r)=>x+r[2],0),g=v.z.reduce((x,r)=>x+r[3],0);return {a,A:a.toUpperCase().replace(/\s+/g,''),n:v.n||'',N:(v.n||'').toLowerCase(),p:v.p,z:v.z,s:v.s,c:v.c,d,k,g,t:d+k+g};});
  document.getElementById('gen').textContent='🕒 обновлено '+db.gen+' · '+ITEMS.length.toLocaleString('ru')+' артик. · все магазины';
  document.getElementById('foot').textContent='Обновлено '+db.gen+' · данные из 1С · остаток: Дом одежды · Дракон · Подарки. Освежается каждый час (08:00–22:00).';
  document.getElementById('q').addEventListener('input',()=>{clearTimeout(tmr);tmr=setTimeout(run,110);});
}).catch(e=>{document.getElementById('gen').textContent='ошибка загрузки данных';});

/* ---------- распознавание бирки ----------
   Штрихкод сканировать нечем: в 1С по OData нет ни каталога, ни регистра штрихкодов,
   сопоставить цифры с товаром не с чем. Поэтому читаем ТЕКСТ артикула — он крупно
   напечатан на каждой бирке и совпадает с ключом в stock.json.
   Tesseract лежит рядом в /ocr, работает офлайн после первой загрузки.               */
var TES=null, OCRBUSY=false;
function ocrSay(h){document.getElementById('ocr').innerHTML=h;}
function loadTes(){
  if(TES)return Promise.resolve(TES);
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src='ocr/tesseract.min.js';
    s.onload=function(){
      /* пути обязаны быть абсолютными: воркер грузит их из своего контекста,
         относительный 'ocr/...' там невалиден */
      var B=new URL('ocr/',location.href).href;
      Tesseract.createWorker('eng',1,{
        workerPath:B+'worker.min.js',
        corePath:B,
        langPath:B,
        logger:function(m){
          if(m.status==='recognizing text'){
            var b=document.getElementById('ocrb'); if(b)b.style.width=Math.round(m.progress*100)+'%';
          }
        }
      }).then(function(w){
        return w.setParameters({
          tessedit_char_whitelist:'0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ-',
          tessedit_pageseg_mode:'11'          /* разрозненный текст: артикул может быть где угодно */
        }).then(function(){TES=w;res(w);});
      }).catch(rej);
    };
    s.onerror=function(){rej(new Error('не загрузился распознаватель'));};
    document.head.appendChild(s);
  });
}
/* фото бывает разное: снятое с экрана даёт блики и муар, снятое в зале — тени.
   Одной обработкой все случаи не покрыть, поэтому готовим НЕСКОЛЬКО вариантов кадра
   и пробуем по очереди, пока не найдём артикул. */
function draw(img,k){
  var c=document.createElement('canvas');
  c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  return c;
}
function grey(c,mode){
  var x=c.getContext('2d'), d=x.getImageData(0,0,c.width,c.height), a=d.data, i;
  var mn=255,mx=0;
  for(i=0;i<a.length;i+=4){var g=a[i]*0.299+a[i+1]*0.587+a[i+2]*0.114;a[i+3+0]=a[i+3];a[i]=g;if(g<mn)mn=g;if(g>mx)mx=g;}
  var rng=Math.max(1,mx-mn);
  for(i=0;i<a.length;i+=4){
    var v=(a[i]-mn)*255/rng;                 /* растягиваем контраст по факту кадра */
    if(mode==='bin')v=v<128?0:255;
    else if(mode==='soft')v=v<95?0:(v>185?255:(v-95)*255/90);
    a[i]=a[i+1]=a[i+2]=v;
  }
  x.putImageData(d,0,0); return c;
}
function variants(file){
  return new Promise(function(res){
    var img=new Image(), url=URL.createObjectURL(file);
    img.onload=function(){
      var big=Math.max(img.width,img.height);
      var k1=Math.min(1,2000/big), k2=Math.min(1.8,2800/big);
      var out=[grey(draw(img,k1),'soft'), grey(draw(img,k2),'bin'), draw(img,k1)];
      URL.revokeObjectURL(url); res(out);
    };
    img.src=url;
  });
}
/* OCR путает O/0, I/1, S/5 — поэтому проверяем не только точное совпадение */
function resolveArt(raw){
  var seen={};
  function push(v,out){if(v&&!seen[v]){seen[v]=1;out.push(v);}}
  var cand=[];
  var p=raw.split('-');
  if(p.length!==4)return [];
  var num=function(t){return t.replace(/O/g,'0').replace(/I/g,'1').replace(/L/g,'1')
                        .replace(/S/g,'5').replace(/B/g,'8').replace(/Z/g,'2').replace(/[^0-9]/g,'');};
  var a=num(p[0]), b=num(p[1]), d=num(p[3]);
  var letters=[p[2].replace(/0/g,'D').replace(/5/g,'S').replace(/1/g,'L').replace(/[^A-Z]/g,''),'D','S','L'];
  for(var li=0;li<letters.length;li++){
    var L=letters[li]; if(!L)continue;
    push(a+'-'+b+'-'+L+'-'+d,cand);
    if(d.length<5)push(a+'-'+b+'-'+L+'-'+('00000'+d).slice(-5),cand);
    if(d.length>5)push(a+'-'+b+'-'+L+'-'+d.slice(-5),cand);
  }
  return cand.filter(function(v){return DB.items&&DB.items[v];});
}
function findArt(txt){
  var re=/(\d{1,4})\s*[-–—]\s*(\d{1,3})\s*[-–—]\s*([A-Z0-9])\s*[-–—]\s*(\d{3,6})/g, m, hits=[];
  txt=(txt||'').toUpperCase();
  while((m=re.exec(txt))!==null){
    var got=resolveArt(m[1]+'-'+m[2]+'-'+m[3]+'-'+m[4]);
    for(var i=0;i<got.length;i++)if(hits.indexOf(got[i])<0)hits.push(got[i]);
  }
  return hits;
}
function scan(file){
  if(OCRBUSY)return; OCRBUSY=true;
  document.getElementById('shot').disabled=true;
  ocrSay('Загружаю распознаватель…<div class="ocrbar"><i id="ocrb"></i></div>');
  var lastTxt='';
  loadTes().then(function(w){
    ocrSay('Читаю бирку…<div class="ocrbar"><i id="ocrb"></i></div>');
    return variants(file).then(function(cs){
      /* проходы по очереди: мягкий контраст -> жёсткое ч/б с увеличением -> исходный кадр */
      return cs.reduce(function(chain,c,idx){
        return chain.then(function(hits){
          if(hits&&hits.length)return hits;
          if(idx)ocrSay('Пробую ещё раз, вариант '+(idx+1)+'…<div class="ocrbar"><i id="ocrb"></i></div>');
          return w.recognize(c).then(function(r){
            lastTxt=r.data.text||lastTxt;
            return findArt(r.data.text);
          });
        });
      },Promise.resolve([]));
    });
  }).then(function(hits){
    if(hits.length){
      document.getElementById('q').value=hits[0];
      run();
      ocrSay('Распознала артикул <b>'+hits[0]+'</b>'+(hits.length>1?' (ещё варианты: '+hits.slice(1).join(', ')+')':''));
    }else{
      var raw=lastTxt.replace(/\s+/g,' ').trim().slice(0,70);
      ocrSay('<span class="bad">Артикул на фото не разобрала.</span> Снимите бирку крупнее и ровно, '
             +'без бликов — строка с артикулом должна попасть в кадр целиком.'
             +(raw?'<br>увидела: '+raw:''));
    }
  }).catch(function(e){
    ocrSay('<span class="bad">Не получилось: '+(e&&e.message?e.message:e)+'</span>');
  }).then(function(){
    OCRBUSY=false; document.getElementById('shot').disabled=false;
  });
}
document.getElementById('shot').addEventListener('click',function(){document.getElementById('cam').click();});
document.getElementById('cam').addEventListener('change',function(e){
  if(e.target.files&&e.target.files[0])scan(e.target.files[0]);
  e.target.value='';
});

</script></body></html>
